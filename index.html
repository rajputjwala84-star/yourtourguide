<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Tour Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-indigo-600 text-white text-center py-6 shadow-md">
        <h1 class="text-3xl font-bold">Your Tour Guide</h1>
        <p class="text-sm mt-1">भारत के बेहतरीन और ऑफबीट ट्रैवेल गाइड्स</p>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-6">लोकप्रिय यात्रा गाइड (Tour Packages)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- Kedarnath Card Only -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                <img src="https://images.unsplash.com/photo-1605649487212-47bdab064df7?auto=format&fit=crop&w=800&q=80" class="w-full h-48 object-cover" alt="Kedarnath">
                <div class="p-4">
                    <div class="flex gap-2 mb-2">
                        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-medium">उत्तराखंड</span>
                        <span class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-medium">धार्मिक यात्रा</span>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900">केदारनाथ धाम यात्रा गाइड</h3>
                    <p class="text-gray-600 text-sm mt-2">बाबा केदारनाथ की यात्रा का पूरा रोडमैप, रजिस्ट्रेशन प्रक्रिया, ट्रैक की जानकारी और बजट गाइड।</p>
                    <a href="kedarnath-guide.html" class="mt-4 inline-block w-full text-center bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">केदारनाथ गाइड देखें →</a>
                </div>
            </div>

        </div>
    </main>

</html>
